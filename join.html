<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cracked* software</title>
<meta name="theme-color" content="#000000">
<style>body{background:#000;color:#fff}</style>
</head>
<body>

<h1>cracked* software.</h1>

<p>* cracked means homemade, non-corporate, dope software.</p>

<form id="f">
  <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required>
  <input type="text" id="website" tabindex="-1" autocomplete="off" hidden>
  <button type="submit" id="go">submit</button>
</form>

<p id="note"></p>

<script>
  const f = document.getElementById('f');
  const email = document.getElementById('email');
  const go = document.getElementById('go');
  const note = document.getElementById('note');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) {
      note.textContent = 'that address does not look right.';
      return;
    }

    go.disabled = true;
    note.textContent = 'adding you...';

    try {
      const r = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: value, source: 'join', website: document.getElementById('website').value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.message || 'something went wrong.');

      f.hidden = true;
      note.textContent = data.new === false ? 'you were already on the list.' : "you're in.";
    } catch (err) {
      go.disabled = false;
      note.textContent = err.message || 'something went wrong. try again, or email loho@lohokur.com.';
    }
  });
</script>
</body>
</html>
