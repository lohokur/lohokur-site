<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cracked* software</title>
<meta name="theme-color" content="#000000">
<style>
  body{ background:#000; color:#fff; min-height:100vh; margin:0;
        display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .mid{ max-width:560px; }
  /* the mark is black artwork — inverted so it reads on black */
  footer{ position:fixed; bottom:20px; left:0; right:0; text-align:center; }
  footer img{ width:70px; filter:invert(1); opacity:.7; }
  h1{ font-size:56px; font-weight:bold; margin:0; }
  .def{ margin:14px 0 0; }
  /* urban-dictionary example: italic, left-barred, left-aligned inside the centred column */
  blockquote{ display:inline-block; text-align:left; font-style:italic;
              border-left:2px solid #fff; margin:24px 0 0; padding:0 0 0 14px; }
  form{ margin:36px 0 0; }
  /* iOS styles form controls by default (rounded, tinted) — strip that back so
     the field and button look the same plain box everywhere */
  input[type=email], button{ -webkit-appearance:none; appearance:none; border-radius:0;
    box-sizing:border-box; font-family:inherit; font-size:16px; padding:12px;
    background:#fff; color:#000; border:1px solid #000; }
  input[type=email]{ width:min(340px,100%); }
  button{ padding:12px 20px; }
  p.note{ min-height:1.2em; }
</style>
</head>
<body>
<div class="mid">

  <h1>cracked*</h1>

  <p class="def">* insanely good at something. homemade software, non-corporate, dope.</p>

  <blockquote>
    Them: is this software legit?<br>
    You: yes. it's cracked.
  </blockquote>

  <form id="f">
    <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required>
    <input type="text" id="website" tabindex="-1" autocomplete="off" hidden>
    <button type="submit" id="go">submit</button>
  </form>

  <p class="note" id="note"></p>

</div>

<footer><a href="/"><img src="/lk-logo.png" alt="LOHO KUR"></a></footer>

<script>
  const f = document.getElementById('f');
  const email = document.getElementById('email');
  const go = document.getElementById('go');
  const note = document.getElementById('note');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) {
      note.textContent = 'that address does not look right.';
      return;
    }

    go.disabled = true;
    note.textContent = 'adding you...';

    try {
      const r = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: value, source: 'join', website: document.getElementById('website').value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.message || 'something went wrong.');

      f.hidden = true;
      note.textContent = data.new === false ? 'you were already on the list.' : "you're in.";
    } catch (err) {
      go.disabled = false;
      note.textContent = err.message || 'something went wrong. try again, or email loho@lohokur.com.';
    }
  });
</script>
</body>
</html>
