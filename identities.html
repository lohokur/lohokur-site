<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identities — LOHO KUR</title>
<meta name="description" content="The living archive of LOHO KUR identities — every character we've created and the ones you build. Search by code or name.">
<meta name="theme-color" content="#07080a">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#07080a; --panel:#0e0f12; --fg:#eef1ee; --muted:#9aa39c; --dim:#6d746e;
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.18);
    --glass:rgba(255,255,255,.045); --glass-line:rgba(255,255,255,.16); --mint:#a9f0d0;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace;
  }
  html,body{ background:var(--ink); color:var(--fg); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body{ overflow-x:hidden; min-height:100%; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }
  .glow{ position:fixed; top:-320px; left:50%; transform:translateX(-50%); width:900px; height:640px;
    background:radial-gradient(ellipse at center, rgba(169,240,208,.13), transparent 62%); pointer-events:none; z-index:0; }

  /* master header — carried over from the homepage (lohokur.com) verbatim */
  .chrome{position:absolute;z-index:200}
  .brand{top:22px;left:34px;height:40px;display:flex;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--fg);text-transform:uppercase;
    text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .brand b{font-weight:700}
  .brand sup{font-size:.55em;top:0;color:var(--fg);opacity:.7}
  .brand a{display:inline-flex;align-items:flex-start;gap:3px}
  .brand .lk-logo{height:19px;width:auto;display:block;filter:invert(1) drop-shadow(0 1px 8px rgba(0,0,0,.55))}
  nav.pill{top:22px;right:30px}
  nav.pill ul{list-style:none;display:flex;align-items:stretch;
    background:rgba(20,24,22,.28);border:1px solid var(--line);border-radius:11px;overflow:hidden;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  nav.pill li+li{border-left:1px solid var(--line)}
  nav.pill a{display:block;padding:11px 20px;font-size:13px;letter-spacing:.01em;color:var(--fg);opacity:.9;
    transition:background .35s ease,opacity .35s ease}
  nav.pill a:hover{background:rgba(255,255,255,.10);opacity:1}
  nav.pill a.active{color:var(--mint);opacity:1}
  nav.pill li.login a{background:var(--fg);color:var(--ink);opacity:1;font-weight:600}
  nav.pill li.login a:hover{background:#a9f0d0;color:var(--ink)}
  .menu-toggle{display:none;position:relative;z-index:2;width:42px;height:38px;padding:0;cursor:pointer;
    flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:1px solid var(--line);border-radius:11px;background:rgba(20,24,22,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .menu-toggle span{display:block;width:16px;height:1.5px;background:var(--fg);border-radius:2px;
    transition:transform .3s ease,opacity .2s ease}
  nav.pill.open .menu-toggle span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
  nav.pill.open .menu-toggle span:nth-child(2){opacity:0}
  nav.pill.open .menu-toggle span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
  .mobile-login{display:none;height:38px;padding:0 16px;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.02em;
    color:var(--ink);background:var(--fg);border:1px solid var(--fg);border-radius:11px;
    box-shadow:0 6px 20px -8px rgba(0,0,0,.6)}
  @media (max-width:720px){
    .brand{left:20px;top:18px}
    nav.pill{top:18px;right:16px;display:flex;align-items:center;gap:10px}
    .menu-toggle{display:flex}
    .mobile-login{display:inline-flex;align-items:center}
    nav.pill ul{position:absolute;top:46px;right:0;flex-direction:column;align-items:stretch;min-width:172px;
      border-radius:12px;transform-origin:top right;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;
      transition:opacity .24s ease,transform .24s ease}
    nav.pill.open ul{opacity:1;transform:none;pointer-events:auto}
    nav.pill li+li{border-left:none;border-top:1px solid var(--line)}
    nav.pill a{padding:13px 18px;font-size:13px;text-align:right}
    nav.pill li.login{display:none}
  }

  /* hero */
  header.hero{ position:relative; z-index:1; text-align:center; padding:120px 24px 8px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mint); }
  h1{ font-size:clamp(34px,5.4vw,58px); font-weight:500; letter-spacing:-.025em; line-height:1.02; margin:16px 0 14px; }
  .hero-sub{ color:var(--muted); font-size:16px; line-height:1.6; max-width:600px; margin:0 auto; }

  /* search bar (sticky) */
  .search-wrap{ position:sticky; top:0; z-index:100; padding:22px 0 18px;
    background:linear-gradient(180deg, var(--ink) 62%, rgba(7,8,10,0)); }
  .search{ position:relative; z-index:1; max-width:560px; margin:0 auto; display:flex; align-items:center; gap:11px;
    border:1px solid var(--line2); border-radius:13px; background:var(--glass);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:0 16px;
    transition:border-color .3s ease, box-shadow .3s ease; }
  .search:focus-within{ border-color:var(--mint); box-shadow:0 0 0 1px rgba(169,240,208,.35), 0 20px 60px -30px rgba(169,240,208,.4); }
  .search .ic{ flex:none; width:15px; height:15px; opacity:.6; }
  .search input{ flex:1; background:none; border:none; outline:none; color:var(--fg);
    font-family:var(--sans); font-size:15px; padding:15px 0; }
  .search input::placeholder{ color:var(--dim); }
  .search .clear{ flex:none; display:none; cursor:pointer; border:none; background:none; color:var(--muted);
    font-family:var(--mono); font-size:16px; line-height:1; padding:6px; }
  .search .clear:hover{ color:var(--fg); }
  .count{ text-align:center; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--dim); margin-top:14px; }
  .count b{ color:var(--mint); font-weight:500; }

  /* card grid */
  .grid{ position:relative; z-index:1; display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:18px; padding:28px 0 90px; }
  .icard{ cursor:default; opacity:0; transform:translateY(10px); animation:rise .55s ease forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  .icard .frame{ position:relative; width:100%; aspect-ratio:168/225; border-radius:15px; overflow:hidden;
    background:var(--glass); border:1px solid var(--glass-line);
    box-shadow:0 24px 60px -34px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s ease, border-color .5s ease; }
  .icard:hover .frame{ transform:translateY(-6px);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.28), inset 0 1px 0 rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.34); }
  .icard canvas{ display:block; width:100%; height:100%; }
  .icard .meta{ position:absolute; left:12px; right:12px; bottom:11px; display:flex; flex-direction:column; gap:2px;
    font-family:var(--mono); letter-spacing:.05em; text-shadow:0 1px 8px rgba(0,0,0,.9); pointer-events:none; }
  .icard .meta .code{ font-size:10px; letter-spacing:.16em; color:var(--mint); }
  .icard .meta .nm{ font-family:var(--sans); font-size:13px; letter-spacing:0; color:rgba(255,255,255,.96);
    text-transform:lowercase; line-height:1.18; }
  .icard .meta .tg{ font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.52); margin-top:1px; }
  .icard .by{ position:absolute; top:11px; left:11px; font-family:var(--mono); font-size:8px; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.72); background:rgba(10,12,11,.55); border:1px solid var(--line);
    border-radius:20px; padding:4px 9px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }

  .empty{ grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--dim);
    font-family:var(--mono); font-size:13px; letter-spacing:.05em; }
  .empty b{ color:var(--muted); }

  footer{ position:relative; z-index:1; margin-top:20px; border-top:1px solid var(--line); padding:26px 0 60px;
    display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:11px;
    color:var(--dim); letter-spacing:.06em; }
  footer a:hover{ color:var(--fg); }

  @media (max-width:720px){
    header.hero{ padding:104px 20px 4px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:13px; }
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="chrome brand"><a href="/"><img class="lk-logo" alt="LOHO KUR" src="/lk-logo.png"><sup>&reg;</sup></a></div>
<nav class="chrome pill" aria-label="Primary">
  <button class="mobile-login" id="loginBtnM" type="button">Go to app</button>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false" aria-controls="navList"><span></span><span></span><span></span></button>
  <ul id="navList">
    <li><a href="/identities" class="active">Identities</a></li>
    <li><a href="/">Showroom</a></li>
    <li><a href="/">Research</a></li>
    <li><a href="/pricing">Pricing</a></li>
    <li><a href="mailto:loho@lohokur.com">Contact</a></li>
    <li class="login"><a href="https://lohokur-app.vercel.app" id="loginBtn">Go to app</a></li>
  </ul>
</nav>

<header class="hero">
  <h1>Identities</h1>
  <p class="hero-sub">Every character in the LOHO KUR world — the ones we've created and the ones you build. Search a code or a name to find one.</p>
</header>

<div class="wrap">
  <div class="search-wrap">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="q" type="text" placeholder="Search LK-016, “the quiet fixer”, armored…" autocomplete="off" spellcheck="false" aria-label="Search identities">
      <button class="clear" id="clear" aria-label="Clear search">✕</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>

  <footer>
    <a href="/">lohokur.com &nbsp;·&nbsp; 2026</a>
    <a href="mailto:loho@lohokur.com">loho@lohokur.com</a>
  </footer>
</div>

<script>
  /* ---- the living archive. `by` = who authored the identity (studio | community). ---- */
  var WORKS=[
    {code:'LK-016',name:'a walking hazard',tag:'futuristic · enigmatic',by:'studio',cols:['#36373a','#efeae0','#4a4f2f','#8f8d86']},
    {code:'LK-017',name:'the quiet fixer',tag:'armoured · enigmatic',by:'studio',cols:['#55565a','#ece9e2','#ff4fa3','#36373a']},
    {code:'LK-018',name:'the one who chose stillness',tag:'composed · enigmatic',by:'studio',cols:['#c9c7c1','#b9b4a8','#8f8d86','#2a2a2c']},
    {code:'LK-019',name:'the armored cook',tag:'armored · enigmatic',by:'studio',cols:['#3a3b3e','#f2ede3','#8f8d86','#141416']},
    {code:'LK-020',name:'the structured enigma',tag:'structured · enigmatic',by:'studio',cols:['#5a606a','#ece9e2','#8f8d86','#222327']},
    {code:'LK-021',name:'the guarded enigma',tag:'guarded · enigmatic',by:'studio',cols:['#222327','#8f8d86','#55565a','#141416']},
    {code:'LK-022',name:'the one with the new uniform',tag:'mysterious · guarded',by:'studio',cols:['#141416','#ece9e2','#a98d63','#0e0e10']},
    {code:'LK-023',name:'someone who keeps leaving',tag:'worn · enigmatic',by:'studio',cols:['#7d7c76','#ece9e2','#8f8d86','#222327']},
    {code:'LK-024',name:'the one in armor',tag:'inscrutable · armored',by:'studio',cols:['#55565a','#c9c7c1','#8f8d86','#141416']},
    {code:'LK-025',name:'the one who left',tag:'mysterious · enveloping',by:'studio',cols:['#222327','#9a9a96','#8f8d86','#141416']},
    {code:'LK-006',name:'unclassified',tag:'archive',by:'studio',cols:['#3a3b3e','#8f8d86','#55565a','#141416']},
    {code:'LK-010',name:'unclassified',tag:'archive',by:'studio',cols:['#3a3b3e','#8f8d86','#55565a','#141416']},
    {code:'LK-011',name:'unclassified',tag:'archive',by:'studio',cols:['#3a3b3e','#8f8d86','#55565a','#141416']},
    {code:'LK-012',name:'unclassified',tag:'archive',by:'studio',cols:['#3a3b3e','#8f8d86','#55565a','#141416']},
    {code:'LK-013',name:'unclassified',tag:'archive',by:'studio',cols:['#3a3b3e','#8f8d86','#55565a','#141416']},
    {code:'LK-014',name:'unclassified',tag:'archive',by:'studio',cols:['#3a3b3e','#8f8d86','#55565a','#141416']},
    {code:'LK-015',name:'unclassified',tag:'archive',by:'studio',cols:['#3a3b3e','#8f8d86','#55565a','#141416']}
  ];

  /* seeded gradient art — same generator as the homepage, so codes with no photo match the world */
  function mk(seed){var s=seed*9301+49297;return function(){s=(s*9301+49297)%233280;return s/233280;};}
  function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function paintArt(cv,cols,seed){
    var w=cv.width,h=cv.height,x=cv.getContext('2d'),R=mk(seed+7);
    var base=hex(cols[cols.length-1]||'#101012');
    x.fillStyle='rgb('+base[0]+','+base[1]+','+base[2]+')'; x.fillRect(0,0,w,h);
    for(var i=0;i<7;i++){
      var cx=R()*w,cy=R()*h,rad=(0.25+R()*0.6)*w;
      var g=x.createRadialGradient(cx,cy,0,cx,cy,rad), c=cols[i%cols.length];
      g.addColorStop(0,c+'cc'); g.addColorStop(1,c+'00');
      x.globalCompositeOperation='lighter'; x.fillStyle=g; x.beginPath(); x.arc(cx,cy,rad,0,7); x.fill();
    }
    x.globalCompositeOperation='overlay'; var lite=cols[1]||cols[0];
    for(var j=0;j<9;j++){
      x.strokeStyle='rgba('+hex(lite).join(',')+','+(0.05+R()*0.14).toFixed(2)+')';
      x.lineWidth=1+R()*2; x.beginPath(); var yy=R()*h; x.moveTo(-10,yy); x.lineTo(w+10,yy+(R()-0.5)*h*0.5); x.stroke();
    }
    x.globalCompositeOperation='source-over';
    var sg=x.createLinearGradient(0,0,0,h);
    sg.addColorStop(0,'rgba(255,255,255,.16)'); sg.addColorStop(.25,'rgba(255,255,255,0)'); sg.addColorStop(1,'rgba(0,0,0,.28)');
    x.fillStyle=sg; x.fillRect(0,0,w,h);
  }
  function drawPhoto(cv,img,cols){
    var w=cv.width,h=cv.height,x=cv.getContext('2d'),cr=w/h,sw,sh,sx,sy;
    if(img.width/img.height>cr){ sh=img.height; sw=sh*cr; sx=(img.width-sw)/2; sy=0; }
    else { sw=img.width; sh=sw/cr; sx=0; sy=(img.height-sh)/2; }
    x.drawImage(img,sx,sy,sw,sh,0,0,w,h);
    x.globalCompositeOperation='source-over';
    var sg=x.createLinearGradient(0,0,0,h);
    sg.addColorStop(0,'rgba(255,255,255,.06)'); sg.addColorStop(.45,'rgba(0,0,0,0)'); sg.addColorStop(1,'rgba(0,0,0,.66)');
    x.fillStyle=sg; x.fillRect(0,0,w,h);
  }

  var grid=document.getElementById('grid');
  var qEl=document.getElementById('q');
  var clearEl=document.getElementById('clear');
  var countEl=document.getElementById('count');

  function render(list){
    grid.innerHTML='';
    if(!list.length){
      grid.innerHTML='<div class="empty">No identity matches <b>'+esc(qEl.value)+'</b>.<br>Try a code like LK-018, or a trait.</div>';
      countEl.innerHTML='<b>0</b> of '+WORKS.length+' identities';
      return;
    }
    list.forEach(function(W,i){
      var el=document.createElement('article'); el.className='icard';
      el.style.animationDelay=Math.min(i*28,420)+'ms';
      el.setAttribute('aria-label',W.name+' — '+W.tag);
      var frame=document.createElement('div'); frame.className='frame';
      var cv=document.createElement('canvas'); cv.width=340; cv.height=456;
      (function(cv2,W2,seed){
        var im=new Image();
        im.onload=function(){ drawPhoto(cv2,im,W2.cols); };
        im.onerror=function(){ paintArt(cv2,W2.cols,seed); };
        im.src='identities/'+W2.code+'.jpg';
      })(cv,W,(parseInt(W.code.slice(3),10)||i)*13);
      var meta=document.createElement('div'); meta.className='meta';
      meta.innerHTML='<span class="code">'+W.code+'</span><span class="nm">'+esc(W.name)+'</span><span class="tg">'+esc(W.tag)+'</span>';
      var by=document.createElement('div'); by.className='by'; by.textContent=W.by==='community'?'community':'LK studio';
      frame.appendChild(cv); frame.appendChild(by); frame.appendChild(meta); el.appendChild(frame);
      grid.appendChild(el);
    });
    countEl.innerHTML='<b>'+list.length+'</b> '+(list.length===1?'identity':'identities')
      +(list.length!==WORKS.length?' of '+WORKS.length:'');
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function filter(){
    var q=qEl.value.trim().toLowerCase().replace(/\s+/g,' ');
    clearEl.style.display=q?'block':'none';
    if(!q){ render(WORKS); return; }
    var out=WORKS.filter(function(W){
      return (W.code+' '+W.name+' '+W.tag+' '+W.by).toLowerCase().indexOf(q)>-1;
    });
    render(out);
  }

  qEl.addEventListener('input',filter);
  clearEl.addEventListener('click',function(){ qEl.value=''; filter(); qEl.focus(); });
  render(WORKS);

  /* master header — hamburger toggle (from homepage) */
  (function(){
    var APP_URL='https://lohokur-app.vercel.app';
    var navp=document.querySelector('nav.pill'), mt=document.getElementById('menuToggle');
    if(!navp) return;
    function setMenu(o){ navp.classList.toggle('open',o); if(mt) mt.setAttribute('aria-expanded',o?'true':'false'); }
    var lbm=document.getElementById('loginBtnM');
    if(lbm) lbm.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); setMenu(false); location.href=APP_URL; });
    if(mt){
      mt.addEventListener('click',function(e){ e.stopPropagation(); setMenu(!navp.classList.contains('open')); });
      navp.querySelectorAll('a').forEach(function(a){ a.addEventListener('click',function(){ setMenu(false); }); });
      document.addEventListener('click',function(e){ if(navp.classList.contains('open') && !navp.contains(e.target)) setMenu(false); });
    }
  })();
</script>
</body>
</html>
