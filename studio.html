<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio — LOHO KUR</title>
<meta name="description" content="We build worlds. Art direction, product design, software development and AI — a collective of hybrid artists, end to end.">
<meta name="theme-color" content="#07080a">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#07080a; --fg:#eef1ee; --muted:#9aa39c; --dim:#6d746e;
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.18); --mint:#a9f0d0;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace;
  }
  html,body{ height:100%; background:var(--ink); color:var(--fg); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }

  /* faint glow, drifted toward the content on the right */
  .glow{ position:fixed; top:50%; right:2%; transform:translateY(-50%); width:720px; height:720px; border-radius:50%;
    background:radial-gradient(circle at center, rgba(169,240,208,.09), transparent 62%); pointer-events:none; z-index:0;
    animation:breathe 7s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.7; transform:translateY(-50%) scale(1); } 50%{ opacity:1; transform:translateY(-50%) scale(1.05); } }

  /* minimal chrome — just the mark, top-left, home */
  .brand{ position:fixed; top:24px; left:28px; z-index:20; display:inline-flex; align-items:flex-start; gap:3px; }
  .brand .lk-logo{ height:18px; width:auto; display:block; filter:invert(1) drop-shadow(0 1px 8px rgba(0,0,0,.55)); opacity:.9; }
  .brand sup{ font-family:var(--mono); font-size:9px; color:var(--fg); opacity:.6; }

  main{ position:relative; z-index:1; min-height:100%; display:flex; align-items:center; justify-content:flex-end;
    padding:120px 7vw 120px 24px; animation:in .8s ease both; }
  @keyframes in{ from{ opacity:0; } to{ opacity:1; } }

  .panel{ max-width:560px; text-align:right; display:flex; flex-direction:column; align-items:flex-end; }
  .name{ font-family:var(--mono); font-size:12.5px; letter-spacing:.2em; color:var(--mint); margin-bottom:22px; }
  .lead{ font-size:clamp(34px,4.6vw,58px); font-weight:500; letter-spacing:-.03em; line-height:.98; color:var(--fg); }
  .desc{ margin-top:24px; font-size:clamp(15px,1.55vw,18.5px); line-height:1.55; color:var(--muted); max-width:460px; }
  .desc .m{ color:var(--fg); }
  .collective{ margin-top:14px; font-size:clamp(13px,1.2vw,15px); line-height:1.5; color:var(--dim); }

  .cta{ margin-top:40px; display:inline-flex; align-items:center; gap:10px; font-size:17px; font-weight:600;
    color:var(--fg); transition:color .25s ease, gap .25s ease; }
  .cta .arrow{ font-family:var(--mono); transition:transform .25s ease; }
  .cta:hover{ color:var(--mint); gap:14px; }
  .cta:hover .arrow{ transform:translateX(3px); }

  @media (max-width:640px){
    main{ justify-content:flex-start; padding:110px 24px; }
    .panel{ text-align:left; align-items:flex-start; }
    .lead{ font-size:clamp(32px,9vw,44px); }
    .desc, .collective{ max-width:none; }
    .glow{ right:-30%; }
  }
</style>
</head>
<body>
<div class="glow"></div>

<a class="brand" href="/"><img class="lk-logo" alt="LOHO KUR" src="/lk-logo.png"><sup>&reg;</sup></a>

<main>
  <div class="panel">
    <div class="name">a nomads home</div>
    <h1 class="lead">We build worlds.</h1>
    <p class="desc">Art direction, product design, software development, and AI — from <span class="m">intelligent systems</span> to <span class="m">intentional visuals</span>.</p>
    <p class="collective">A collective of hybrid artists, end to end.</p>
    <a class="cta" href="mailto:loho@lohokur.com?subject=A%20brief%20for%20LOHO%20KUR&body=The%20world%20you're%20building%3A%0A%0AWhat%20you%20need%20from%20us%3A%0A%0ATimeline%3A%0A%0A">Work with us <span class="arrow">→</span></a>
  </div>
</main>
</body>
</html>
